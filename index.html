<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPEL - Sistem Informasi Materi Pelatih</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- LOGIN PAGE -->
    <div id="login-page" class="flex items-center justify-center min-h-screen p-4 bg-slate-900">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-100">
            <div class="text-center mb-8">
<div class="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg overflow-hidden bg-white border-2 border-red-600">
    <img src="Logo_Dojo.png" alt="Logo Dojo" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150?text=LOGO'">
</div>
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">S I M P E L</h1>
                <p class="text-sm text-gray-500 mt-1">Sistem Informasi Materi Pelatih</p>
            </div>
            
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fas fa-user"></i>
                        </span>
                        <input type="text" id="username" required class="w-full pl-10 pr-4 py-3 border rounded-xl focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition" placeholder="Masukkan username">
                    </div>
                </div>
                
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" id="password" required class="w-full pl-10 pr-4 py-3 border rounded-xl focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition" placeholder="Masukkan password">
                    </div>
                </div>

                <div id="login-error" class="hidden bg-red-50 text-red-600 p-3 rounded-xl text-sm font-medium text-center"></div>

                <button type="submit" id="btn-login" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow-lg transition duration-200 flex items-center justify-center space-x-2">
                    <span>Masuk Aplikasi</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard" class="hidden min-h-screen flex flex-col">
        <!-- Header Nav -->
        <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-3">
<span class="w-10 h-10 rounded-lg overflow-hidden bg-white flex items-center justify-center shadow border border-red-600">
    <img src="Logo_Dojo.png" alt="Logo Dojo" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150?text=LOGO'">
</span>
                    <h1 class="text-xl font-bold tracking-wide">SIMPEL MJA PANGANDARAN</h1>
                </div>
                <button onclick="logout()" class="text-sm bg-slate-800 hover:bg-slate-700 text-gray-300 px-4 py-2 rounded-lg border border-slate-700 transition">
                    <i class="fas fa-sign-out-alt mr-1"></i> Keluar
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Panel: Navigation Categories -->
            <aside class="lg:col-span-5 bg-white p-5 rounded-2xl shadow-sm border border-gray-200 flex flex-col h-[calc(100vh-120px)] sticky top-20">
                <h2 class="text-lg font-bold text-gray-900 mb-3 flex items-center">
                    <i class="fas fa-list-ul mr-2 text-red-600"></i> Silabus Materi
                </h2>
                
                <!-- Filter Search -->
                <div class="mb-4">
                    <input type="text" id="search-input" onkeyup="filterMateri()" placeholder="Cari nama gerakan..." class="w-full px-4 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-500">
                </div>

                <!-- Accordion Menu -->
                <div id="materi-container" class="overflow-y-auto flex-grow space-y-3 pr-1">
                    <div class="text-center py-10 text-gray-400">
                        <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                        <p class="text-sm">Memuat data dari database...</p>
                    </div>
                </div>
            </aside>

            <!-- Right Panel: Video Preview Player -->
            <section class="lg:col-span-7 bg-white p-5 rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-bold text-gray-900 mb-3 flex items-center">
                        <i class="fas fa-video mr-2 text-red-600"></i> Peragaan Gerakan
                    </h2>
                    
                    <div id="video-wrapper" class="w-full aspect-video bg-slate-900 rounded-xl overflow-hidden flex items-center justify-center relative shadow-inner">
                        <div id="video-placeholder" class="text-center p-6 text-gray-400">
                            <i class="fas fa-circle-play text-5xl mb-3 opacity-60"></i>
                            <p class="text-sm">Pilih salah satu gerakan di menu sebelah kiri untuk melihat video.</p>
                        </div>
                        <iframe id="video-player" class="hidden w-full h-full border-0" allow="autoplay" allowfullscreen></iframe>
                    </div>

                    <div class="mt-4">
                        <h3 id="current-title" class="text-xl font-bold text-gray-900"></h3>
                        <p id="current-category" class="text-sm text-gray-500 mt-1"></p>
                    </div>
                </div>

                <div class="mt-6 pt-4 border-t border-gray-100 text-xs text-center text-gray-400">
                    Sistem Informasi Materi Pelatih &copy; Tim Manajemen MJA | KJI Dojo Pangandaran
                </div>
            </section>
        </main>
    </div>

    <!-- Script Application -->
    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxCojgOItFNG8ALjiJM3qtF2SB7A9tNqFLA3XmTA3r7iledKjG-U5ndt10HUPB634cu/exec";

        let rawMateriData = [];

        window.onload = function() {
            if (localStorage.getItem("simpel_user")) {
                showDashboard();
            }
        };

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById("btn-login");
            const errDiv = document.getElementById("login-error");
            
            errDiv.classList.add("hidden");
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span>Memeriksa...</span>`;

            const usernameInput = document.getElementById("username").value;
            const passwordInput = document.getElementById("password").value;

            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "login", username: usernameInput, password: passwordInput })
                });
                
                const res = await response.json();
                
                if (res.status === "success") {
                    localStorage.setItem("simpel_user", res.username);
                    showDashboard();
                } else {
                    errDiv.innerText = res.message;
                    errDiv.classList.remove("hidden");
                }
            } catch (error) {
                errDiv.innerText = "Gagal terhubung ke server database.";
                errDiv.classList.remove("hidden");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>Masuk Aplikasi</span> <i class="fas fa-arrow-right"></i>`;
            }
        }

        function logout() {
            localStorage.removeItem("simpel_user");
            location.reload();
        }

        function showDashboard() {
            document.getElementById("login-page").classList.add("hidden");
            document.getElementById("dashboard").classList.remove("hidden");
            loadMateri();
        }

        async function loadMateri() {
            try {
                const response = await fetch(`${GAS_URL}?action=getMateri`);
                const res = await response.json();
                
                if (res.status === "success") {
                    rawMateriData = res.data;
                    renderAccordion(rawMateriData);
                }
            } catch (err) {
                document.getElementById("materi-container").innerHTML = `
                    <div class="text-center py-6 text-red-500 text-sm">Gagal memuat materi silabus.</div>
                `;
            }
        }

        function renderAccordion(data) {
            const container = document.getElementById("materi-container");
            container.innerHTML = "";

            if (data.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 py-6 text-sm">Tidak ada data gerakan.</div>`;
                return;
            }

            const grouped = {};
            data.forEach(item => {
                if (!grouped[item.kategori]) grouped[item.kategori] = {};
                if (!grouped[item.kategori][item.sub_kategori]) grouped[item.kategori][item.sub_kategori] = [];
                grouped[item.kategori][item.sub_kategori].push(item);
            });

            let catIdx = 0;
            for (const kat in grouped) {
                catIdx++;
                const katId = `kat-${catIdx}`;
                
                let subHtml = "";
                for (const subKat in grouped[kat]) {
                    let itemHtml = "";
                    grouped[kat][subKat].forEach(g => {
                        itemHtml += `
                            <button onclick="playVideo('${g.nama_gerakan}', '${kat} - ${subKat}', '${g.link_video}')" 
                               class="w-full text-left py-2 px-3 text-sm text-gray-700 hover:bg-red-50 hover:text-red-600 rounded-lg transition flex items-center justify-between group">
                                <span><i class="far fa-play-circle mr-2 text-gray-400 group-hover:text-red-600"></i>${g.nama_gerakan}</span>
                                <i class="fas fa-chevron-right text-xs opacity-0 group-hover:opacity-100 transition"></i>
                            </button>
                        `;
                    });

                    subHtml += `
                        <div class="ml-3 my-2 border-l-2 border-gray-200 pl-3">
                            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">${subKat}</h4>
                            <div class="space-y-1">${itemHtml}</div>
                        </div>
                    `;
                }

                const catCard = `
                    <div class="border border-gray-200 rounded-xl overflow-hidden">
                        <button onclick="toggleAccordion('${katId}')" class="w-full bg-gray-50 px-4 py-3 text-left font-bold text-gray-800 flex justify-between items-center hover:bg-gray-100 transition">
                            <span>${kat}</span>
                            <i id="icon-${katId}" class="fas fa-chevron-down text-gray-500 transition-transform"></i>
                        </button>
                        <div id="${katId}" class="hidden p-2 bg-white">
                            ${subHtml}
                        </div>
                    </div>
                `;
                container.innerHTML += catCard;
            }
        }

        function toggleAccordion(id) {
            const el = document.getElementById(id);
            const icon = document.getElementById(`icon-${id}`);
            if (el.classList.contains("hidden")) {
                el.classList.remove("hidden");
                icon.classList.add("rotate-180");
            } else {
                el.classList.add("hidden");
                icon.classList.remove("rotate-180");
            }
        }

        function playVideo(nama, detail, link) {
            const player = document.getElementById("video-player");
            const placeholder = document.getElementById("video-placeholder");
            
            document.getElementById("current-title").innerText = nama;
            document.getElementById("current-category").innerText = detail;

            placeholder.classList.add("hidden");
            player.classList.remove("hidden");
            player.src = link;
        }

        function filterMateri() {
            const query = document.getElementById("search-input").value.toLowerCase();
            const filtered = rawMateriData.filter(item => 
                item.nama_gerakan.toLowerCase().includes(query) ||
                item.kategori.toLowerCase().includes(query) ||
                item.sub_kategori.toLowerCase().includes(query)
            );
            renderAccordion(filtered);
            
            if (query.trim() !== "") {
                document.querySelectorAll('#materi-container > div > div').forEach(el => el.classList.remove('hidden'));
            }
        }
    </script>
</body>
</html>
